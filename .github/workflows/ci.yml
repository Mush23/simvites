name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, 07:00 UTC. The integration suite talks to a real database, so a
    # regression can also arrive from Supabase's side — a schema change, an RLS
    # policy edited in the dashboard — with no commit to trigger CI.
    - cron: '0 7 * * *'

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any ESLint ERROR, and on more than the 36 warnings that
      # existed when linting was first switched on (the budget lives in the
      # npm script). Existing React Compiler debt can shrink, never grow.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Misuse regressions (docs/MISUSE-REVIEW.md). Feeds hostile input to the
      # real modules and needs NO database, so unlike the integration job it
      # runs on every push including fork PRs. Each assertion names the finding
      # it guards; a failure means that fix has been undone.
      - name: Misuse regressions
        run: npm run test:misuse

      - name: Build
        run: npm run build
        env:
          # Public env vars are required at build time; CI uses harmless dummies.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_ROOT_DOMAIN: simvites.co.uk

  integration:
    name: Integration tests (ephemeral Supabase)
    runs-on: ubuntu-latest
    # Only worth the database round-trips once the cheap checks are green.
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each run gets its own throwaway Supabase (Postgres + Auth + PostgREST)
      # on the runner. Deliberately NOT a hosted project behind secrets: the
      # only one that existed was production, and both suites create and delete
      # organisations and auth users. This also means the job runs on pull
      # requests from forks, where secrets are unavailable by design.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start ephemeral Supabase
        run: supabase start

      # The CLI applies supabase/migrations on first start. Export the local
      # stack's generated credentials for the suites; they are throwaway values
      # belonging to a container that is destroyed with the runner.
      - name: Export local credentials
        run: |
          supabase status -o env > "$RUNNER_TEMP/supa.env"
          # Key NAMES only (values are throwaway container credentials). If the
          # CLI ever renames one, this line is what tells you which.
          echo "keys reported: $(cut -d= -f1 "$RUNNER_TEMP/supa.env" | tr '\n' ' ')"
          get() { grep -m1 "^$1=" "$RUNNER_TEMP/supa.env" | cut -d'"' -f2; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "DATABASE_URL=$(get DB_URL)"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/supa.env"

      # A hosted project grants new public tables to anon/authenticated/
      # service_role through default privileges; the ephemeral stack does not
      # for the role the CLI migrates as, so PostgREST 403s on everything.
      # Mirrors production exactly — tables and sequences only, never functions.
      - name: Match production grants
        run: node scripts/ci-apply-grants.mjs

      # A migration that failed to apply otherwise surfaces as a confusing
      # PostgREST error mid-suite, which reads as "isolation is broken". Fail
      # here instead, naming the missing piece.
      - name: Database ready?
        run: node scripts/ci-db-ready.mjs

      # Signs in as a real user under RLS and proves one org cannot read or
      # write another's rows. The single most important thing in the product.
      - name: Tenant isolation (RLS)
        run: npm run test:isolation

      # Invite-gating, resubmission, capacity (including a concurrent race),
      # deadlines, archived guests, question validation.
      - name: RSVP correctness
        run: npm run test:rsvp

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
