  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"margin-top:30px;display:flex;flex-wrap:wrap;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px\">\n    <span style=\"border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink-2)\">Next.js + Vercel<\u002Fspan>\n    <span style=\"border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink-2)\">Supabase + RLS<\u002Fspan>\n    <span style=\"border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink-2)\">Puck editor<\u002Fspan>\n    <span style=\"border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink-2)\">OKLCH tokens<\u002Fspan>\n    <span style=\"border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink-2)\">Resend · Stripe · Inngest · PostHog<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-01\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">01 — Executive recommendation<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:20ch\">Rename, narrow, and go embarrassingly deep on one thing.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 18px\">You have a genuinely good wedge and a stack that fits it. The risk is not ambition — it's <em>breadth<\u002Fem>. This brief, taken literally, describes a 2-year platform. Build that in MVP and you will ship something mediocre on every axis. The win is to pick the single hardest, most valuable job — multi-event weddings where different guests are invited to different ceremonies — and make that feel category-best, then let one clean data model carry you into birthdays and corporate later.<\u002Fp>\n  <p data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(23px,3.3vw,33px);line-height:1.24;color:var(--ink);max-width:30ch;margin:30px 0 38px;padding-left:22px;border-left:2px solid var(--accent)\">Rename to Occasio, ship one breathtaking template, charge once per event, and own South Asian multi-event weddings before touching anything else.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px\">The decision ledger<\u002Fdiv>\n  <div data-reveal=\"\" style=\"overflow-x:auto;margin-bottom:44px\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px\">\n    <thead><tr>\n      <th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 16px 11px 0;border-bottom:1px solid var(--line-2);width:18%\">Decision<\u002Fth>\n      <th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 16px 11px 0;border-bottom:1px solid var(--line-2);width:32%\">Recommendation<\u002Fth>\n      <th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 0 11px 0;border-bottom:1px solid var(--line-2)\">Why<\u002Fth>\n    <\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Brand<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">Rename → <span style=\"color:var(--accent-ink)\">Occasio<\u002Fspan><\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Simvites is hard to say/spell, trademark-risky, and semantically caps you at \"invites.\" Occasio = occasion; it scales to every event and reads premium.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Category<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">\"Event experience platform\"<\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Not \"wedding website builder.\" Broader category, higher willingness-to-pay, defensible past the wedding.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">MVP shape<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">One template · one flow · email only<\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Depth over breadth. A lean MVP that still feels expensive beats a broad one that feels cheap.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">First template<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">\"Aanya\" — neutral-luxe multi-event<\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Covers the hardest case (multi-day, per-guest visibility). Every other template is a simplification of it.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Pricing<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">One-time event package + concierge<\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Weddings are one-off. Subscriptions punish the buyer and guarantee churn. Sell the outcome, once.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Guest identity<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">Secure token links · guests ≠ users<\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Zero-friction, privacy-safe RSVP. No accounts for guests, ever. Magic-link / OTP designed for later.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Launch surface<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">Platform subdomains first<\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">name.occasio.events<\u002Fspan>. Custom domains designed-for, deferred.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Editor<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">Puck + locked block library<\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Curated modular blocks, never a freeform canvas. Protects template quality and responsiveness.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">Schema language<\u002Ftd><td style=\"padding:13px 16px 13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;vertical-align:top\">site · event · guest · household · response<\u002Ftd><td style=\"padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top\">No \"wedding\" in the data model. One schema serves weddings → birthdays → conferences.<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:13px 16px 13px 0;color:var(--ink-2);vertical-align:top\">Tech stack<\u002Ftd><td style=\"padding:13px 16px 13px 0;color:var(--ink);font-weight:600;vertical-align:top\">Keep it as proposed<\u002Ftd><td style=\"padding:13px 0;color:var(--ink-2);vertical-align:top\">It's the right stack. Spend the energy on UX and template craft, not re-architecture.<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px\">Five bets we're making<\u002Fdiv>\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:44px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--accent-ink);line-height:1;margin-bottom:10px\">01<\u002Fdiv><div style=\"font-weight:650;font-size:15.5px;color:var(--ink);margin-bottom:6px\">The logic is the wedge<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--ink-2)\">\"A website\" is a commodity. Per-event, per-guest invitation logic is what spreadsheets can't do — that's the pain we kill.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--accent-ink);line-height:1;margin-bottom:10px\">02<\u002Fdiv><div style=\"font-weight:650;font-size:15.5px;color:var(--ink);margin-bottom:6px\">Taste is the moat<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--ink-2)\">Couples pay for restraint and craft. One magazine-grade template beats fifty average ones, and is far cheaper to maintain.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--accent-ink);line-height:1;margin-bottom:10px\">03<\u002Fdiv><div style=\"font-weight:650;font-size:15.5px;color:var(--ink);margin-bottom:6px\">Fluency, not decoration<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--ink-2)\">Neutral-luxe defaults with optional cultural presets win South Asian families. Tokenism and motif-spam lose them.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--accent-ink);line-height:1;margin-bottom:10px\">04<\u002Fdiv><div style=\"font-weight:650;font-size:15.5px;color:var(--ink);margin-bottom:6px\">Price the outcome<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--ink-2)\">A flawless guest-comms layer for the biggest day of someone's life is worth hundreds, paid once — not a £12/mo habit.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--accent-ink);line-height:1;margin-bottom:10px\">05<\u002Fdiv><div style=\"font-weight:650;font-size:15.5px;color:var(--ink);margin-bottom:6px\">Broad nouns, no rebuild<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--ink-2)\">Generic primitives now mean birthdays and conferences are configuration later — not a second product.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n    <div style=\"background:var(--bad-soft);border:1px solid var(--line);border-radius:16px;padding:24px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);margin-bottom:14px\">Where I push back on the brief<\u002Fdiv>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;font-size:14.5px;line-height:1.5;color:var(--ink-2)\">\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:1px 5px;flex:none;height:fit-content;margin-top:2px\">CUT<\u002Fspan><span><strong style=\"color:var(--ink)\">18 registration models in MVP.<\u002Fstrong> Ship one (per-household token). Design the rest into the schema; build on demand.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:1px 5px;flex:none;height:fit-content;margin-top:2px\">CUT<\u002Fspan><span><strong style=\"color:var(--ink)\">Generous freemium.<\u002Fstrong> Free tier = private draft + preview only. Publishing and sending are paid, or you'll drown in tire-kickers and support.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:1px 5px;flex:none;height:fit-content;margin-top:2px\">CUT<\u002Fspan><span><strong style=\"color:var(--ink)\">Many templates at launch.<\u002Fstrong> One, exceptional. Template breadth is a Phase-2 growth lever, not an MVP requirement.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:1px 5px;flex:none;height:fit-content;margin-top:2px\">DEFER<\u002Fspan><span><strong style=\"color:var(--ink)\">Seating charts, WhatsApp, galleries.<\u002Fstrong> Support-heavy, not why the first cheque is written. Phase 2.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:1px 5px;flex:none;height:fit-content;margin-top:2px\">HIDE<\u002Fspan><span><strong style=\"color:var(--ink)\">Corporate language in the UI.<\u002Fstrong> Keep it in the data model, out of the surface, until you actually sell to corporates.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:14px\">The one risk that matters most<\u002Fdiv>\n      <p style=\"font-family:'Instrument Serif',serif;font-size:clamp(21px,2.6vw,27px);line-height:1.28;color:var(--ink);margin:0 0 14px\">Premium is binary. If the first template and the RSVP flow don't feel category-best <em>on a phone<\u002Fem>, nothing else in this document matters.<\u002Fp>\n      <p style=\"font-size:14.5px;line-height:1.6;color:var(--ink-2);margin:0\">Build those two surfaces to a magazine standard before you build anything else. Everything in §22–§24 is sized around that bar.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-02\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">02 — Brand &amp; naming<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:20ch\">A name that can hold a wedding — and everything after it.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 34px\">A brand name has one job at this stage: be sayable, ownable, and big enough to grow into. It should make a couple proud to put it at the bottom of their wedding website, and make a corporate buyer comfortable three years later. Measured that way, the working name fails — and a clear winner emerges.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"background:var(--bad-soft);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:40px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);margin-bottom:14px\">Verdict on \"Simvites\" — rename<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 26px\">\n      <div><div style=\"font-weight:650;color:var(--ink);font-size:14.5px;margin-bottom:4px\">It caps you at \"invites\"<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:var(--ink-2)\">The name literally <em>is<\u002Fem> the smallest feature. It can't stretch to event sites, guest ops, or non-wedding occasions without feeling wrong.<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight:650;color:var(--ink);font-size:14.5px;margin-bottom:4px\">It reads cheap<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:var(--ink-2)\">\"Sim-\" evokes SIM cards and \"simple\"; \"-vites\" is a fragment. Together it sounds like a budget app, not a brand you'd proudly share.<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight:650;color:var(--ink);font-size:14.5px;margin-bottom:4px\">It mis-types and mis-hears<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:var(--ink-2)\">Simvites / Simvights / Symvites — real spelling and pronunciation friction every time it's spoken aloud at a wedding.<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight:650;color:var(--ink);font-size:14.5px;margin-bottom:4px\">It's weakly distinctive<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:var(--ink-2)\">A portmanteau of a generic term in a crowded \"invite\" namespace — harder to trademark, harder to rank, easy to confuse.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px\">The longlist · 20 names scored<\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-size:13.5px;color:var(--ink-3);margin:0 0 16px;max-width:60ch\">Prem = premium feel · Scale = stretch beyond weddings · Own = domain &amp; trademark headroom. <span style=\"color:var(--accent-ink)\">★<\u002Fspan> winner · <span style=\"color:var(--ok)\">✓<\u002Fspan> survives the first cut · <span style=\"color:var(--ink-3)\">—<\u002Fspan> cut.<\u002Fp>\n  <div data-reveal=\"\" style=\"overflow-x:auto;margin-bottom:40px\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px\">\n    <thead><tr>\n      <th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 12px 10px 0;border-bottom:1px solid var(--line-2)\">Name<\u002Fth>\n      <th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font- retch. Pick this if trademark clearance on Occasio gets messy — it's the lowest-risk path to a fully ownable brand.<\u002Fp>\n      <div style=\"border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;line-height:1.6;color:var(--ink-2)\"><strong style=\"color:var(--ink)\">Domain:<\u002Fstrong> <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">veyra.events / veyra.co<\u002Fspan>.<br><strong style=\"color:var(--ink)\">Watch:<\u002Fstrong> health/beauty near-homophones (Vyra, Veira) — different classes, low risk.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px\">Heritage-forward<\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',serif;font-size:40px;line-height:1;color:var(--ink);margin-bottom:4px\">Jashn<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-3);margin-bottom:16px\">JASHN · Urdu/Hindi, \"celebration\"<\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;line-height:1.3;color:var(--accent-ink);margin-bottom:14px\">\"Let the celebration begin.\"<\u002Fdiv>\n      <p style=\"font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 14px\">The most emotionally resonant for the beachhead — it <em>means<\u002Fem> celebration. The trade-off is global scale: it leans the brand South Asian, which you said you want to avoid hard-coding.<\u002Fp>\n      <div style=\"border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;line-height:1.6;color:var(--ink-2)\"><strong style=\"color:var(--ink)\">Domain:<\u002Fstrong> <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">getjashn.com / jashn.events<\u002Fspan>.<br><strong style=\"color:var(--ink)\">Watch:<\u002Fstrong> spelling for non-SA buyers; crowded events TM in India.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:18px;padding:26px 28px;display:flex;gap:22px;align-items:center;flex-wrap:wrap\">\n    <div style=\"flex:1;min-width:260px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px\">If I were the founder<\u002Fdiv>\n      <p style=\"font-family:'Instrument Serif',serif;font-size:clamp(22px,2.8vw,28px);line-height:1.26;color:var(--ink);margin:0\">I'd ship as <strong style=\"font-style:normal\">Occasio<\u002Fstrong>. The meaning does the marketing for free, it looks expensive set in a serif, and it never boxes you into weddings. Keep <strong style=\"font-style:normal\">Veyra<\u002Fstrong> in your pocket as the clean fallback if clearance bites.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px\">\n      <span style=\"color:var(--ink-3)\">RENAME<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;gap:8px;color:var(--ink)\"><span style=\"text-decoration:line-through;opacity:.5\">Simvites<\u002Fspan> → <strong style=\"color:var(--accent-ink)\">Occasio<\u002Fstrong><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-03\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">03 — Positioning<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 26px;max-width:20ch\">Say the hard thing simply.<\u002Fh2>\n\n  <div data-reveal=\"\" style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;margin-bottom:34px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px\">One-sentence positioning<\u002Fdiv>\n    <p style=\"font-family:'Instrument Serif',serif;font-size:clamp(24px,3.6vw,36px);line-height:1.24;color:var(--ink);margin:0\">Occasio turns one beautiful website into personalised invitations and per-event RSVPs — so hosts run complex, multi-event celebrations without a single spreadsheet.<\u002Fp>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:34px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px\">Hero headline options<\u002Fdiv>\n      <ol style=\"margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:h\">\n        <li style=\"font-family:'Instrument Serif',serif;font-size:21px;line-height:1.25;color:var(--ink)\">Your whole celebration, on one beautiful link.<\u002Fli>\n        <li style=\"font-family:'Instrument Serif',serif;font-size:21px;line-height:1.25;color:var(--ink)\">One website. Every event. Every guest, exactly the right invite.<\u002Fli>\n        <li style=\"font-family:'Instrument Serif',serif;font-size:21px;line-height:1.25;color:var(--ink)\">The spreadsheet-free way to run a multi-day wedding.<\u002Fli>\n        <li style=\"font-family:'Instrument Serif',serif;font-size:21px;line-height:1.25;color:var(--ink-3)\">Invitations, RSVPs and updates — as considered as the day itself.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px\">Subheadline options<\u002Fdiv>\n      <ul style=\"margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.55;color:var(--ink-2)\">\n        <li>Build a stunning event site, send personalised invites, and track every RSVP — across every ceremony, from one place.<\u002Fli>\n        <li>Made for weddings where different guests are invited to different events. Beautiful enough for everything after.<\u002Fli>\n        <li>From the roka to the reception: one link that quietly knows who's invited to what.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px\">The pitch, five ways<\u002Fdiv>\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:24px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px\">Short<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)\">Occasio is the premium, spreadsheet-free way to invite and manage guests across a multi-event wedding. One link, every ceremony, every RSVP — handled.<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px\">Founder elevator<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)\">\"South Asian weddings are five events, not one — and Auntie's invited to three of them, not all five. Every tool today assumes one party and one guest list. We built the one that doesn't.\"<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px\">Customer-facing<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)\">Make a website your family will actually be proud of, send each household their own invitation, and watch the yeses come in — without chasing replies on WhatsApp or rebuilding a spreadsheet at midnight.<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px\">Investor<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)\">A wedge into a high-spend, underserved segment (South Asian multi-event weddings) with a horizontal engine. We monetise the moment of highest intent, then reuse one schema to expand into the £-billions of birthdays, celebrations and corporate events.<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px\">Long<\u002Fdiv><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)\">Occasio is an event-experience platform. Hosts choose a designer-grade template, customise it with controlled visual blocks, and publish a fast, mobile-first website. They manage guests as households, decide who is invited to which event, and send each household a personalised, secure link. Guests see only the events meant for them, RSVP per ceremony, and get live updates. Every response is one source of truth — exportable, never a spreadsheet.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:34px\">\n    <div style=\"background:var(--paper-2);border:1px dashed var(--line-2);border-radius:14px;padding:18px 20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">SEO title · 58 chars<\u002Fdiv><div style=\"font-size:15px;color:var(--ink);font-weight:600\">Occasio — Wedding Websites, Invitations &amp; RSVPs, Beautifully Run<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border:1px dashed var(--line-2);border-radius:14px;padding:18px 20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Meta description · 152 chars<\u002Fdiv><div style=\"font-size:14px;color:var(--ink-2);line-height:1.5\">Create a stunning multi-event wedding website, send personalised invitations, and track RSVPs for every ceremony — no spreadsheets. Free to start.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:34px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">Category definition<\u002Fdiv>\n    <p style=\"margin:0;font-size:15.5px;line-height:1.62;color:var(--ink-2)\"><strong style=\"color:var(--ink)\">Event-experience platform<\u002Fstrong> — the layer between \"a website builder\" and \"a guest CRM.\" Incumbents own one or the other; Occasio unifies the <em>public site<\u002Fem>, the <em>invitation<\u002Fem>, and the <em>response<\u002Fem> into a single system of record for an occasion. That unification is the product.<\u002Fp>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:34px\">\n    <div style=\"overflow-x:auto\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">vs. wedding website builders<\u002Fdiv>\n      <table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n        <thead><tr><th style=\"text-align:left;padding:0 8px 8px 0;border-bottom:1px solid var(--line-2);font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;text-transform:uppercase;color:var(--ink-3)\"><\u002Fth><th style=\"padding:0 6px 8px;border-bottom:1px solid var(--line-2);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:var(--accent-ink)\">Occasio<\u002Fth><th style=\"padding:0 0 8px;border-bottom:1px solid var(--line-2);font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;text-transform:uppercase;color:var(--ink-3)\">Joy · Zola · Minted<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody style=\"vertical-align:top\">\n          <tr><td style=\"padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Per-event, per-guest invites<\u002Ftd><td style=\"text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)\">Single guest list<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Household RSVP logic<\u002Ftd><td style=\"text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)\">Partial<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">South Asian fluency<\u002Ftd><td style=\"text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)\">US-centric<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Guest CRM + export<\u002Ftd><td style=\"text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)\">Basic<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:9px 8px 9px 0;color:var(--ink-2)\">Pricing fit<\u002Ftd><td style=\"text-align:center;padding:9px 6px;color:var(--ok);font-weight:700\">Premium once<\u002Ftd><td style=\"padding:9px 0;color:var(--ink-3)\">Free + paper upsell<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">vs. RSVP tools<\u002Fdiv>\n      <table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n        <thead><tr><th style=\"text-align:left;padding:0 8px 8px 0;border-bottom:1px solid var(--line-2);font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;text-transform:uppercase;color:var(--ink-3)\"><\u002Fth><th style=\"padding:0 6px 8px;border-bottom:1px solid var(--line-2);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:var(--accent-ink)\">Occasio<\u002Fth><th style=\"padding:0 0 8px;border-bottom:1px solid var(--line-2);font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;text-transform:uppercase;color:var(--ink-3)\">RSVPify · Partiful · Sheets<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody style=\"vertical-align:top\">\n          <tr><td style=\"padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Full event website<\u002Ftd><td style=\"text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)\">Form only<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Per-event visibility<\u002Ftd><td style=\"text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)\">One form<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Premium, on-brand design<\u002Ftd><td style=\"text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)\">Generic<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Live updates / publish<\u002Ftd><td style=\"text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)\">—<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:9px 8px 9px 0;color:var(--ink-2)\">One source of truth<\u002Ftd><td style=\"text-align:center;padding:9px 6px;color:var(--ok);font-weight:700\">●<\u002Ftd><td style=\"padding:9px 0;color:var(--ink-3)\">Fragmented<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:30px\">\n    <div style=\"background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:22px\"><div style=\"font-weight:700;color:var(--ink);font-size:15px;margin-bottom:8px\">Why it's genuinely different<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--ink-2)\">Per-event, per-guest logic is <em>first-class<\u002Fem>, not bolted on. The site, the invite and the response are one system, not three tools stitched by a spreadsheet. And premium, culturally-fluent design is the default, not a paid theme.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-weight:700;color:var(--ink);font-size:15px;margin-bottom:8px\">Why South Asian weddings are the ideal beachhead<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--ink-2)\">Real structural pain (multi-day, divergent guest lists), high spend and high standards, an incumbent set that is US-centric and tin-eared, and tight, referral-dense, digital-first diaspora communities that make distribution cheap.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-weight:700;color:var(--ink);font-size:15px;margin-bottom:8px\">How it expands beyond weddings<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--ink-2)\">Same engine, new presets. The multi-event model that handles a wedding trivially handles a milestone birthday, a baby shower, a religious celebration, then a conference. You change the words and the template — never the architecture.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px\">\n    <span style=\"background:var(--accent);color:#fff;border-radius:8px;padding:7px 12px;font-weight:500\">Multi-event weddings<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan>\n    <span style=\"border:1px solid var(--line);color:var(--ink-2);border-radius:8px;padding:7px 12px\">Engagements · anniversaries<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan>\n    <span style=\"border:1px solid var(--line);color:var(--ink-2);border-radius:8px;padding:7px 12px\">Birthdays · showers<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan>\n    <span style=\"border:1px solid var(--line);color:var(--ink-2);border-radius:8px;padding:7px 12px\">Religious · community<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan>\n    <span style=\"border:1px solid var(--line);color:var(--ink-2);border-radius:8px;padding:7px 12px\">Corporate · conferences<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-04\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">04 — Target users &amp; personas<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">One buyer. Many anxious stakeholders.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 36px\">The couple pays, but they are rarely alone — a mother runs one side's list, a planner watches over everything, and hundreds of guests (some 75, some 7) touch the product once. Design for the buyer's confidence and the guest's ease; everything else follows.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-bottom:34px\">\n\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\"><div style=\"font-family:'Instrument Serif',serif;font-size:25px;color:var(--ink)\">The Couple<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:6px;padding:3px 8px\">Primary buyer<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;color:var(--accent-ink);margin-bottom:16px;line-height:1.35\">\"We want it to look incredible — and we never want to touch a spreadsheet.\"<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55\">\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Goals<\u002Fspan><div style=\"color:var(--ink-2)\">A site they're proud to share; total clarity on who's coming to what; no chasing.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Pains<\u002Fspan><div style=\"color:var(--ink-2)\">5 events, 5 guest lists, WhatsApp chaos, parents adding names hourly, fear of looking cheap.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Pays when<\u002Fspan><div style=\"color:var(--ink-2)\">The template makes them gasp and the invite preview looks personal and premium.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Churns when<\u002Fspan><div style=\"color:var(--ink-2)\">It feels generic, breaks on mobile, or an invite goes to the wrong person.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Win moment<\u002Fspan><div style=\"color:var(--ink)\">First real RSVP lands and the dashboard ticks up — without a spreadsheet in sight.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\"><div style=\"font-family:'Instrument Serif',serif;font-size:25px;color:var(--ink)\">The Family Lead<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px\">Co-manager<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;color:var(--accent-ink);margin-bottom:16px;line-height:1.35\">\"Our side has 200 guests. I need to manage them without breaking anything.\"<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55\">\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Goals<\u002Fspan><div style=\"color:var(--ink-2)\">Own one side's households; control who's invited to which event; not embarrass anyone.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Pains<\u002Fspan><div style=\"color:var(--ink-2)\">Often older/less technical; terrified of \"messing up the website\"; duplicate names.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Needs<\u002Fspan><div style=\"color:var(--ink-2)\">Guest tools that are separate from the site editor, so they can't break the design.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Churns when<\u002Fspan><div style=\"color:var(--ink-2)\">The interface assumes tech fluency or one wrong click feels catastrophic.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Win moment<\u002Fspan><div style=\"color:var(--ink)\">Pastes 60 names, groups them into households, and it just works.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\"><div style=\"font-family:'Instrument Serif',serif;font-size:25px;color:var(--ink)\">The Guest<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px\">Volume user<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;color:var(--accent-ink);margin-bottom:16px;line-height:1.35\">\"Which events am I actually invited to, and what do I need to do?\"<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55\">\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Goals<\u002Fspan><div style=\"color:var(--ink-2)\">Understand the invite in 20 seconds on a phone; RSVP without an account.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Pains<\u002Fspan><div style=\"color:var(--ink-2)\">Confusion about which events apply to them; clunky forms; \"is this legit?\"<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Needs<\u002Fspan><div style=\"color:var(--ink-2)\">A warm, personalised welcome; only their events; obvious next step.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Trust signal<\u002Fspan><div style=\"color:var(--ink-2)\">Seeing their own name and the couple's brand on open — not a generic form.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Win moment<\u002Fspan><div style=\"color:var(--ink)\">Taps \"Joyfully accept,\" sees a confirmation, done in under a minute.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\"><div style=\"font-family:'Instrument Serif',serif;font-size:25px;color:var(--ink)\">The Elder Guest<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px\">Edge, high-stakes<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;color:var(--accent-ink);margin-bottom:16px;line-height:1.35\">\"I don't really use these things — can someone just do it for me?\"<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55\">\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Reality<\u002Fspan><div style=\"color:var(--ink-2)\">May have no email, a shared phone, or low digital confidence — but must be counted.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Needs<\u002Fspan><div style=\"color:var(--ink-2)\">Big tap targets, large type, no jargon — or to be RSVP'd manually by the host.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Product answer<\u002Fspan><div style=\"color:var(--ink-2)\">Host-entered RSVP + a phone-call-friendly flow. Never a dead end.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Win moment<\u002Fspan><div style=\"color:var(--ink)\">Their attendance is recorded accurately, with zero stress on either side.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\"><div style=\"font-family:'Instrument Serif',serif;font-size:25px;color:var(--ink)\">The Planner<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px\">Power user · channel<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;color:var(--accent-ink);margin-bottom:16px;line-height:1.35\">\"If this makes my couples look good and saves me hours, I'll bring every client.\"<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55\">\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Goals<\u002Fspan><div style=\"color:var(--ink-2)\">Run multiple client events, look premium, reduce admin, get referrals.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Pains<\u002Fspan><div style=\"color:var(--ink-2)\">Juggling tools per client; chasing RSVPs; re-explaining the same thing.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Pays when<\u002Fspan><div style=\"color:var(--ink-2)\">Phase 2: multi-client workspace + their branding. A natural distribution flywheel.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">MVP role<\u002Fspan><div style=\"color:var(--ink-2)\">Design partner &amp; referrer, not a feature. Court them; don't build for them yet.<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)\">Win moment<\u002Fspan><div style=\"color:var(--ink)\">Sends a client a finished site in an afternoon and looks like a hero.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--paper-2);border:1px dashed var(--line-2);border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px\">Future personas — design for, don't build for<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px;font-size:13px;line-height:1.5;color:var(--ink-2)\">\n        <div><strong style=\"color:var(--ink)\">Birthday / milestone host<\u002Fstrong> — wants beauty + ease, low stakes, high volume, price-sensitive.<\u002Fdiv>\n        <div><strong style=\"color:var(--ink)\">Baby shower / naming host<\u002Fstrong> — guest-count + dietary focus; gift preferences matter.<\u002Fdiv>\n        <div><strong style=\"color:var(--ink)\">Religious / community organiser<\u002Fstrong> — recurring events, large lists, info-first not RSVP-first.<\u002Fdiv>\n        <div><strong style=\"color:var(--ink)\">Corporate / conference organiser<\u002Fstrong> — registration, job-title fields, approval, check-in. Phase 4.<\u002Fdiv>\n        <div><strong style=\"color:var(--ink)\">Venue partner<\u002Fstrong> — wants a co-branded, repeatable setup for every booking. Partnership lever.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-05\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">05 — Product principles<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 24px;max-width:16ch\">Fifteen rules that settle arguments.<\u002Fh2>\n\n  <div data-reveal=\"\" style=\"background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:18px;padding:28px 30px;margin-bottom:32px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px\">North star<\u002Fdiv>\n    <p style=\"font-family:'Instrument Serif',serif;font-size:clamp(24px,3.4vw,34px);line-height:1.24;color:var(--ink);margin:0\">Make hosts look effortlessly tasteful, and make every guest feel personally invited.<\u002Fp>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden\">\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">01<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Taste is the product<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">If a control lets a user make something ugly, don't ship that control. Curate, don't expose.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">02<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">The guest is the volume user<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">The phone RSVP is used 100× more than the editor. Optimise it above everything.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">03<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">No spreadsheets, ever<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Every guest fact lives in one model. Export is a feature — never the place truth actually lives.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">04<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Logic over forms<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Per-event, per-guest invitation rules are first-class — and enforced server-side, not in the UI.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">05<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Separate fragile from safe<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Guest ops can't break the design; editing can't leak a draft. Different rooms, different keys.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">06<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Fluency, not decoration<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Offer cultural presets; default to neutral elegance; never assume or impose a religion.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">07<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Guests are not users<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">No accounts, no passwords. Secure token links, and nothing stored that could ever leak a list.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">08<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Mobile-first, truly<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Design at 375px first. Desktop is the enhancement, not the canvas everything is drawn on.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">09<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Calm under pressure<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">This runs during the most stressful week of a life. Reliability beats cleverness, always.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">10<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Accessible by default<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">AA contrast, large targets, real focus states, type an 80-year-old can read on a phone.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">11<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Fast is a feature<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Public sites read from static published snapshots. Sub-second loads on a hotel Wi-Fi.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">12<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Buildable by one founder + AI<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Prefer managed services and boring, well-trodden patterns over anything clever or bespoke.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">13<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Broad nouns, narrow UI<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Schema speaks site/event/guest; the surface speaks the host's words (couple, ceremony, mehndi).<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">14<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Flexible by structure<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Hosts add, rename, reorder, hide and duplicate events freely. Nothing about the day is hard-coded.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent-ink);line-height:1;margin-bottom:8px\">15<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:5px\">Publishing is deliberate<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Drafts stay private. Going live and notifying guests are explicit, considered, separate choices.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-06\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">06 — South Asian coverage strategy<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:20ch\">\"South Asian\" is not one wedding. So don't build modes — build primitives.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 30px\">A Punjabi Sikh wedding, a Tamil Hindu wedding, a Pakistani Nikah and a London interfaith civil ceremony share almost nothing in structure — and everything in needing to look beautiful and tell guests what to do. The trap is building a \"Hindu mode\" and a \"Sikh mode.\" The win is a flexible event engine plus thoughtful presets a host <em>opts into<\u002Fem> and then edits freely.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:34px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:9px\">Mechanism 01<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:15px;margin-bottom:6px\">Neutral by default<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:var(--ink-2)\">Every new site starts elegant and culture-neutral. No symbols, no assumptions — a blank, beautiful canvas.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:9px\">Mechanism 02<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:15px;margin-bottom:6px\">Opt-in preset packs<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:var(--ink-2)\">A host can apply a \"Sikh wedding\" or \"Gujarati Hindu\" preset that seeds suggested events, copy and notes — as a starting point.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:9px\">Mechanism 03<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:15px;margin-bottom:6px\">Everything is editable<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:var(--ink-2)\">A preset is a head-start, never a cage. Rename, remove, reorder, add — including events we've never heard of.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:9px\">Mechanism 04<\u002Fdiv><div style=\"font-weight:700;color:var(--ink);font-size:15px;margin-bottom:6px\">Custom types &amp; labels<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:var(--ink-2)\">\"Create your own event,\" rename \"Couple\" to anything, relabel \"RSVP.\" The schema bends to the host's language.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"margin-bottom:26px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">Religious &amp; cultural wedding types the system must flex to<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n      <span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Hindu<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Sikh<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Muslim · Nikah · Walima<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Christian South Asian<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Catholic South Asian<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Jain<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Buddhist<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Zoroastrian · Parsi<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Interfaith<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Civil · Registry<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)\">Fusion<\u002Fspan><span style=\"border
