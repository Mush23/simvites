time-poor.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px\"><div style=\"font-weight:700;color:var(--ink);font-size:14px;margin-bottom:8px\">Later: subscriptions<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Planner (multi-client, monthly), venue/partner, corporate per-event. Add-ons: domains, WhatsApp credits, storage.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-29\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">29 — Go-to-market<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">Niche, referral-dense, content-led.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 30px\">A solo founder wins here by being unmissably good in one tight community. Land 10 design-partner weddings, make them gorgeous, and let referrals and Reels do the rest before spending a penny on ads.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px\">Pre-launch<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--ink-2)\">Waitlist landing + a 60-sec demo video, three template previews, founder story, and DMs to South-Asian wedding planners and photographers. Collect emails and book demos before the build is even finished.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px\">Design partners<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--ink-2)\"><strong style=\"color:var(--ink)\">8–12 couples<\u002Fstrong>, free or near-free Premium. In return: weekly feedback, a testimonial, a public case study, and two referrals each. They are your first marketing reel and your QA team.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"margin-bottom:26px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">Channels<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n      <span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Instagram<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">TikTok<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Pinterest<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Wedding planners<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">SA suppliers<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Photographers<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Venues<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Bridal MUAs<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Community groups<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Referrals<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">SEO<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)\">Wedding fairs ○<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"margin-bottom:26px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px\">30 content ideas for Reels / TikTok / posts<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 18px;font-size:12.5px;line-height:1.45;color:var(--ink-2)\">\n      <div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">01<\u002Fspan> POV: Auntie's invited to 3 of 5 events<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">02<\u002Fspan> Spreadsheet chaos → clean dashboard<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">03<\u002Fspan> Build a wedding site in 5 minutes<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">04<\u002Fspan> \"Who's invited to what?\" explained<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">05<\u002Fspan> Mehndi vs Sangeet vs Reception lists<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">06<\u002Fspan> Full template tour: Aanya<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">07<\u002Fspan> RSVP on a phone in 30 seconds<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">08<\u002Fspan> What SA wedding sites get wrong<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">09<\u002Fspan> Personalised invite reveal (your name)<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">10<\u002Fspan> Plus-ones without the chaos<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">11<\u002Fspan> A multi-day timeline, designed<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">12<\u002Fspan> No more \"did you RSVP?\" texts<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">13<\u002Fspan> Dark-mode site reveal<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">14<\u002Fspan> Cultural preset walkthrough<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">15<\u002Fspan> Real couple case study<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">16<\u002Fspan> Live RSVP counter ticking up<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">17<\u002Fspan> Dietary + kids handled cleanly<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">18<\u002Fspan> Founder story: why I built this<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">19<\u002Fspan> BTS: designing the template<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">20<\u002Fspan> Send each family their own invite<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">21<\u002Fspan> Top 5 wedding-website mistakes<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">22<\u002Fspan> RSVP for non-techy elders<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">23<\u002Fspan> Pinterest aesthetic boards<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">24<\u002Fspan> Auto-reminders demo<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">25<\u002Fspan> What to put on your site (checklist)<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">26<\u002Fspan> Occasio vs spreadsheet vs Joy<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">27<\u002Fspan> Update guests when a time changes<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">28<\u002Fspan> Planner collab teaser<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">29<\u002Fspan> One-time price, not a subscription<\u002Fdiv><div><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-ink)\">30<\u002Fspan> Launch countdown / waitlist push<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">SEO clusters &amp; landing pages<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\"><strong style=\"color:var(--ink)\">Clusters:<\u002Fstrong> \"south asian / indian / sikh / muslim wedding website\", \"multi-event RSVP\", \"wedding guest list manager\", \"[Zola / Joy / The Knot] alternative UK\".<br><strong style=\"color:var(--ink)\">Pages:<\u002Fstrong> /south-asian-weddings · /sikh-wedding-website · /hindu-wedding-website · /muslim-wedding-website · /multi-event-rsvp · /[city] (London · Leicester · Birmingham).<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">Partnerships &amp; founder sales<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\"><strong style=\"color:var(--ink)\">Partners:<\u002Fstrong> planners, photographers, MUAs, venues, caterers, stationers — angle: \"give your couples a free Premium,\" referral commission, co-branding.<br><strong style=\"color:var(--ink)\">Sales loop:<\u002Fstrong> warm DM → 15-min demo → free Premium for design partners → build it with them → ask for a testimonial + two referrals.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-30\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">30 — Legal, trust &amp; data<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">You hold guest lists. Earn the trust that implies.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 14px\">Hosts are handing you their families' names, emails and dietary details. Treat that data as sacred, say so plainly, and build the protections in from day one. Privacy is also a feature you can market.<\u002Fp>\n  <p data-reveal=\"\" style=\"font-size:13px;line-height:1.55;color:var(--ink-3);max-width:62ch;margin:0 0 28px;font-style:italic\">Not legal advice — a checklist to take to a solicitor / DPO before launch.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:10px\">Data protection (UK/EU GDPR)<\u002Fdiv><ul style=\"margin:0;padding-left:17px;font-size:12.5px;line-height:1.6;color:var(--ink-2)\"><li>Lawful basis per data type (contract / consent)<\u002Fli><li>Retention policy — auto-purge guest data N months post-event<\u002Fli><li>One-click export &amp; delete for hosts<\u002Fli><li>DPAs with subprocessors (Supabase, Resend, Stripe, Vercel)<\u002Fli><li>EU/UK data residency where possible<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:10px\">Guest privacy<\u002Fdiv><ul style=\"margin:0;padding-left:17px;font-size:12.5px;line-height:1.6;color:var(--ink-2)\"><li>Guests are not users — no accounts, no passwords<\u002Fli><li>Access via single-use-ish secure tokens; never store raw tokens<\u002Fli><li>Guest lists never publicly enumerable or indexable<\u002Fli><li>Transactional email only — no marketing to guests, ever<\u002Fli><li>Per-guest data visible only to that household<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:10px\">Policies to prepare<\u002Fdiv><ul style=\"margin:0;padding-left:17px;font-size:12.5px;line-height:1.6;color:var(--ink-2)\"><li>Privacy policy &amp; cookie notice (analytics consent)<\u002Fli><li>Terms of service (host responsibilities for their list)<\u002Fli><li>Data processing addendum (you = processor for guest data)<\u002Fli><li>Acceptable-use (anti-spam) for invite sending<\u002Fli><li>Security page ○ — later, once you have practices to show<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:10px\">Support &amp; live-event ops<\u002Fdiv><ul style=\"margin:0;padding-left:17px;font-size:12.5px;line-height:1.6;color:var(--ink-2)\"><li>Set support expectations clearly (hours, channel)<\u002Fli><li>A real plan for \"it's broken on the wedding day\"<\u002Fli><li>Status page / incident comms ○<\u002Fli><li>Backups + point-in-time restore on the database<\u002Fli><li>RLS + tenant isolation audited before launch<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-31\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">31 — Technical architecture implications<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">Get the data model right once.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 26px\">A handful of decisions here prevent painful rebuilds later. Broad nouns, strict tenant isolation, and a clean draft/published split are the load-bearing walls.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:22px;overflow-x:auto\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px\">Core entities (broad nouns — never \"wedding\")<\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.9;color:var(--ink-2);white-space:nowrap\">\n      <div><span style=\"color:var(--accent-ink)\">organisation<\u002Fspan> ─ owns ─ <span style=\"color:var(--accent-ink)\">site<\u002Fspan> ─ has ─ theme · page[] · <span style=\"color:var(--accent-ink)\">event<\u002Fspan>[]<\u002Fdiv>\n      <div><span style=\"color:var(--accent-ink)\">site<\u002Fspan> ─ has ─ <span style=\"color:var(--accent-ink)\">household<\u002Fspan>[] ─ contains ─ <span style=\"color:var(--accent-ink)\">guest<\u002Fspan>[]<\u002Fdiv>\n      <div><span style=\"color:var(--accent-ink)\">invitation<\u002Fspan> = (guest × event) visibility + caps + plus-one flags<\u002Fdiv>\n      <div><span style=\"color:var(--accent-ink)\">response<\u002Fspan> = guest's RSVP per event (+ answers)<\u002Fdiv>\n      <div><span style=\"color:var(--accent-ink)\">message_batch<\u002Fspan> · <span style=\"color:var(--accent-ink)\">published_version<\u002Fspan> (snapshot) · tracking_event · audit_log · asset<\u002Fdiv>\n      <div style=\"color:var(--ink-3)\">future: seating · gallery · registration_form · ticket<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden\">\n    <div style=\"background:var(--surface);padding:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)\"><span style=\"color:var(--bad);font-weight:700\">✦<\u002Fspan> <strong style=\"color:var(--ink)\">RLS + tenant isolation<\u002Fstrong> on every table — non-negotiable, audited pre-launch<\u002Fdiv>\n    <div style=\"background:var(--surface);padding:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)\"><span style=\"color:var(--bad);font-weight:700\">✦<\u002Fspan> <strong style=\"color:var(--ink)\">Public reads from published snapshot only<\u002Fstrong> — never live draft tables<\u002Fdiv>\n    <div style=\"background:var(--surface);padding:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)\"><span style=\"color:var(--bad);font-weight:700\">✦<\u002Fspan> <strong style=\"color:var(--ink)\">Guests are not users<\u002Fstrong> — access via secure token → short-lived session<\u002Fdiv>\n    <div style=\"background:var(--surface);padding:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)\"><span style=\"color:var(--bad);font-weight:700\">✦<\u002Fspan> <strong style=\"color:var(--ink)\">Store token hashes, never raw tokens<\u002Fstrong> — rotate &amp; revoke supported<\u002Fdiv>\n    <div style=\"background:var(--surface);padding:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)\"><span style=\"color:var(--bad);font-weight:700\">✦<\u002Fspan> <strong style=\"color:var(--ink)\">RSVP caps enforced server-side<\u002Fstrong> — never trust the client<\u002Fdiv>\n    <div style=\"background:var(--surface);padding:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)\"><span style=\"color:var(--bad);font-weight:700\">✦<\u002Fspan> <strong style=\"color:var(--ink)\">Storage policies<\u002Fstrong> scoped per site; signed URLs for assets<\u002Fdiv>\n    <div style=\"background:var(--surface);padding:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)\"><span style=\"color:var(--bad);font-weight:700\">✦<\u002Fspan> <strong style=\"color:var(--ink)\">Subdomains first<\u002Fstrong> — custom domains designed-for, deferred<\u002Fdiv>\n    <div style=\"background:var(--surface);padding:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)\"><span style=\"color:var(--bad);font-weight:700\">✦<\u002Fspan> <strong style=\"color:var(--ink)\">Background jobs (Inngest)<\u002Fstrong> for sends, reminders, snapshot builds<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-32\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">32 — Frontend build checklist<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">What to actually build, by surface.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:16px;line-height:1.6;color:var(--ink-2);max-width:60ch;margin:0 0 26px\"><span style=\"color:var(--accent-ink);font-weight:600\">●<\u002Fspan> MVP · <span style=\"color:var(--ink-3)\">○<\u002Fspan> later.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px\">Marketing<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.85;color:var(--ink-2)\"><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Homepage<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> SA weddings landing<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Pricing<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Templates / examples<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Login / signup<br><span style=\"color:var(--ink-3)\">○<\u002Fspan> Celebrations · About · Blog<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px\">App<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.85;color:var(--ink-2)\"><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Dashboard<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Onboarding + template picker<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Editor + theme<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Events · Guests · Invite matrix<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Invites · RSVP dashboard<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Publish · Settings · Billing<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px\">Public site<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.85;color:var(--ink-2)\"><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Home (personalised)<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Schedule · Travel · FAQ<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> RSVP + confirmation<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Updates<br><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Expired / locked / no-invite states<br><span style=\"color:var(--ink-3)\">○<\u002Fspan> Gallery · Find my table<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px\">Templates<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.85;color:var(--ink-2)\"><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Aanya (luxe multi-event)<br><span style=\"color:var(--ink-3)\">○<\u002Fspan> Colourful Mehndi/Sangeet<br><span style=\"color:var(--ink-3)\">○<\u002Fspan> Minimal Modern<br><span style=\"color:var(--ink-3)\">○<\u002Fspan> Faith presets (Sikh/Hindu/Nikah)<br><span style=\"color:var(--ink-3)\">○<\u002Fspan> Birthday · Celebration<br><span style=\"color:var(--ink-3)\">○<\u002Fspan> Professional<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-33\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">33 — Prioritised build plan for Claude Code<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">Seven phases, in order. Hand this over.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 30px\">Build the foundation and data model first so nothing is rebuilt; then marketing for waitlist, then the app, the builder, and the two phone surfaces that decide everything. Polish last.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:90px 1fr;gap:18px\"><div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--accent-ink)\">Phase 0<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:19px;color:var(--ink);line-height:1.1\">Foundation<\u002Fdiv><\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\">Next.js App Router on Vercel · Supabase (Postgres + Auth + Storage) · Tailwind v4 + OKLCH tokens · component primitives · app/auth shell · route structure · <strong style=\"color:var(--ink)\">data model + RLS baseline<\u002Fstrong> · seed/dummy data.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:90px 1fr;gap:18px\"><div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--accent-ink)\">Phase 1<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:19px;color:var(--ink);line-height:1.1\">Marketing<\u002Fdiv><\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\">Homepage · South Asian weddings landing · pricing · templates gallery · waitlist/contact · signup. Ship early to start collecting emails &amp; demos.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:90px 1fr;gap:18px\"><div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--accent-ink)\">Phase 2<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:19px;color:var(--ink);line-height:1.1\">App shell<\u002Fdiv><\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\">Dashboard · onboarding · site creation · template picker · setup checklist. The authed skeleton everything hangs off.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:90px 1fr;gap:18px\"><div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--accent-ink)\">Phase 3<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:19px;color:var(--ink);line-height:1.1\">Site builder<\u002Fdiv><\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\">Puck integration · core block library · theme editor · page manager · device preview · draft store. Build \"Aanya\" as the reference template.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:90px 1fr;gap:18px\"><div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--accent-ink)\">Phase 4 ★<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:19px;color:var(--ink);line-height:1.1\">Guests &amp; RSVP<\u002Fdiv><\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\">Household/guest model + UI · <strong style=\"color:var(--ink)\">invite matrix<\u002Fstrong> · token resolve → public guest welcome · <strong style=\"color:var(--ink)\">RSVP flow + confirmation<\u002Fstrong> · server-side caps. The make-or-break surfaces.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:90px 1fr;gap:18px\"><div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--accent-ink)\">Phase 5<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:19px;color:var(--ink);line-height:1.1\">Invites &amp; publishing<\u002Fdiv><\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\">Invite preview/editor · batch send (Resend + Inngest) · delivery dashboard · reminders · publish modal → snapshot · published site renderer on subdomain.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:90px 1fr;gap:18px\"><div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--accent-ink)\">Phase 6<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:19px;color:var(--ink);line-height:1.1\">Polish<\u002Fdiv><\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2)\">Empty/error/loading states · responsive refinement · accessibility pass · dark mode · motion · Stripe unlock · PostHog · demo data · template polish to the magazine bar.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-34\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">34 — Risks &amp; mitigations<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 28px;max-width:18ch\">What could break this — and the answer.<\u002Fh2>\n\n  <div data-reveal=\"\" style=\"overflow-x:auto\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:13px;min-width:580px\">\n    <thead><tr>\n      <th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 14px 10px 0;border-bottom:1px solid var(--line-2);width:30%\">Risk<\u002Fth>\n      <th style=\"text-align:center;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 10px;border-bottom:1px solid var(--line-2)\">Sev.<\u002Fth>\n      <th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 0 10px;border-bottom:1px solid var(--line-2)\">Mitigation<\u002Fth>\n    <\u002Ftr><\u002Fthead>\n    <tbody style=\"vertical-align:top\">\n      <tr><td style=\"padding:11px 14px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Template/RSVP not \"wow\" — premium promise fails<\u002Ftd><td style=\"text-align:center;padding:11px 10px;border-bottom:1px solid var(--line);color:var(--bad);font-weight:700\">High<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Over-invest in Aanya + the phone RSVP; design-partner critique before public launch<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 14px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Email deliverability — invites hit spam<\u002Ftd><td style=\"text-align:center;padding:11px 10px;border-bottom:1px solid var(--line);color:var(--bad);font-weight:700\">High<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Resend + SPF/DKIM/DMARC, transactional-only, copyable-link fallback for every guest<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 14px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Cultural missteps damage trust<\u002Ftd><td style=\"text-align:center;padding:11px 10px;border-bottom:1px solid var(--line);color:var(--bad);font-weight:700\">High<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Neutral defaults, opt-in presets, the §08 rules, community reviewers per faith<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 14px 11px 0;b 02Ftd><td style=\"padding:11px 0;color:var(--ink-2)\">Paywall publishing &amp; sending; keep free to preview-only; concierge is paid<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-35\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">35 — Final recommendation<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:20ch\">Approve the vision. Cut the scope. Ship Occasio.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 30px\">The idea is genuinely good and the wedge is real. The only way to lose is to build the whole brief at once. Rename, ship one breathtaking template and a flawless RSVP, charge once, and let a tight community carry you.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:30px\">\n    <div style=\"background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:18px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px\">Brand<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:var(--ink)\">Occasio<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ink-3)\">fallback: Veyra<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px\">First template<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:var(--ink)\">Aanya<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ink-3)\">neutral-luxe, multi-event<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px\">Pricing<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:var(--ink)\">One-time<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ink-3)\">£149 / £299 / +£250<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px\">MVP<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:var(--ink)\">1 + 1 + 1<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ink-3)\">template · flow · channel<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:30px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:13px\">First 10 screens<\u002Fdiv>\n      <ol style=\"margin:0;padding-left:20px;font-size:12.5px;line-height:1.75;color:var(--ink-2)\"><li>Guest RSVP (mobile)<\u002Fli><li>Public home · Aanya<\u002Fli><li>Host dashboard<\u002Fli><li>Invite matrix<\u002Fli><li>Guest &amp; household manager<\u002Fli><li>Onboarding / site creation<\u002Fli><li>Editor + theme<\u002Fli><li>Send invites + delivery<\u002Fli><li>Publish modal + confirm<\u002Fli><li>Marketing homepage<\u002Fli><\u002Fol>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:13px\">First 10 components<\u002Fdiv>\n      <ol style=\"margin:0;padding-left:20px;font-size:12.5px;line-height:1.75;color:var(--ink-2)\"><li>Button set<\u002Fli><li>Form kit (input/select/toggle)<\u002Fli><li>Event card<\u002Fli><li>Guest / household card<\u002Fli><li>RSVP status pill<\u002Fli><li>Invite-matrix cell<\u002Fli><li>Stat card<\u002Fli><li>Setup checklist<\u002Fli><li>Modal / drawer<\u002Fli><li>Empty / error / loading<\u002Fli><\u002Fol>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:13px\">First 10 Claude Code tasks<\u002Fdiv>\n      <ol style=\"margin:0;padding-left:20px;font-size:12.5px;line-height:1.7;color:var(--ink-2)\"><li>Scaffold Next + Supabase + Tailwind v4 + tokens<\u002Fli><li>Schema + RLS (site/event/guest/response…)<\u002Fli><li>Auth + org + app shell + routing<\u002Fli><li>Primitives + light/dark theme<\u002Fli><li>Onboarding + template picker<\u002Fli><li>Aanya template as Puck blocks + theme editor<\u002Fli><li>Households/guests + paste import<\u002Fli><li>Invite matrix + server-side caps<\u002Fli><li>Token → guest welcome → RSVP + confirm<\u002Fli><li>Resend + Inngest + snapshot + subdomain + Stripe<\u002Fli><\u002Fol>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"background:var(--ink);border-radius:20px;padding:34px 36px;text-align:center\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px\">Final verdict<\u002Fdiv>\n    <p style=\"font-family:'Instrument Serif',serif;font-size:clamp(26px,4vw,40px);line-height:1.18;color:var(--paper);margin:0 0 12px\">Approve — with the cuts.<\u002Fp>\n    <p style=\"font-size:15px;line-height:1.6;color:var(--paper);opacity:.82;margin:0 auto;max-width:54ch\">Keep every ambition in the roadmap. Build a fraction of it now. Rename to Occasio, perfect Aanya and the RSVP, charge once, win South Asian multi-event weddings — then let the same engine carry you everywhere else.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding:54px 0 80px;border-top:1px solid var(--line);margin-top:20px\">\n  <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:14px\">\n    <span style=\"width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--accent)\"><\u002Fspan><\u002Fspan>\n    <span style=\"font-family:'Instrument Serif',serif;font-size:23px;color:var(--ink)\">Occasio<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font-size:13.5px;color:var(--ink-3);margin:0;max-width:60ch;line-height:1.6\">Product · brand · UX · build blueprint — prepared as a build-ready foundation to hand to Claude Code. Toggle the theme, or use Save PDF to export. v1 · June 2026.<\u002Fp>\n<\u002Ffooter>\n\n<div data-sentinel=\"end\"><\u002Fdiv><\u002Fdiv>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;,&quot;options&quot;:[&quot;#b3502f&quot;,&quot;#1f7a52&quot;,&quot;#3b50c4&quot;,&quot;#3a342f&quot;]},&quot;reveals&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount(){\n    this._root = document.documentElement;\n    let t = null;\n    try { t = localStorage.getItem('occ-theme'); } catch(e){}\n    if(!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';\n    this.applyTheme(t);\n    const acc = this.props.accent;\n    if(acc){ this._root.style.setProperty('--accent', acc); this._root.style.setProperty('--accent-ink', acc); }\n    this.setupSpy();\n    if(this.props.reveals !== false) this.setupReveal();\n    this._bp = ()=>{ this._prev=this._theme; this.applyTheme('light'); document.querySelectorAll('[data-reveal]').forEach(el=>{el.style.opacity='1';el.style.transform='none';}); };\n    this._ap = ()=>{ if(this._prev) this.applyTheme(this._prev); };\n    window.addEventListener('beforeprint', this._bp);\n    window.addEventListener('afterprint', this._ap);\n  }\n  componentWillUnmount(){\n    window.removeEventListener('beforeprint', this._bp);\n    window.removeEventListener('afterprint', this._ap);\n  }\n  applyTheme(t){\n    this._theme = t;\n    document.documentElement.setAttribute('data-theme', t);\n    try { localStorage.setItem('occ-theme', t); } catch(e){}\n    const lbl = document.querySelector('[data-theme-label]');\n    if(lbl) lbl.textContent = (t === 'dark') ? 'Light' : 'Dark';\n  }\n  toggleTheme = () => { this.applyTheme(this._theme === 'dark' ? 'light' : 'dark'); };\n  printDoc = () => { window.print(); };\n  setupSpy(){\n    const links = Array.from(document.querySelectorAll('[data-nav]'));\n    const setActive = (id) => {\n      links.forEach(l => {\n        const on = l.getAttribute('data-nav') === id;\n        l.style.color = on ? 'var(--ink)' : 'var(--ink-3)';\n        l.style.borderLeftColor = on ? 'var(--accent)' : 'transparent';\n        l.style.background = on ? 'var(--surface-2)' : 'transparent';\n        l.style.fontWeight = on ? '600' : '400';\n      });\n    };\n    const secs = Array.from(document.querySelectorAll('section[id]'));\n    if(!secs.length) return;\n    const io = new IntersectionObserver((entries)=>{\n      entries.forEach(e=>{ if(e.isIntersecting) this._cur = e.target.id; });\n      if(this._cur) setActive(this._cur);\n    }, { rootMargin: '-8% 0px -82% 0px', threshold: 0 });\n    secs.forEach(s=>io.observe(s));\n    setActive('s-00');\n  }\n  setupReveal(){\n    if(!('IntersectionObserver' in window) || !window.Element || !Element.prototype.animate) return;\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    const io = new IntersectionObserver((entries, obs)=>{\n      entries.forEach(e=>{\n        if(e.isIntersecting){\n          e.target.animate([{opacity:0, transform:'translateY(18px)'},{opacity:1, transform:'none'}], {duration:680, easing:'cubic-bezier(.22,1,.36,1)'});\n          obs.unobserve(e.target);\n        }\n      });\n    }, { rootMargin: '-2% 0px -8% 0px', threshold: 0.05 });\n    const vh = window.innerHeight || 800;\n    els.forEach(el=>{ const r = el.getBoundingClientRect(); if(r.top < vh*0.92) return; io.observe(el); });\n  }\n  renderVals(){ return { toggleTheme: this.toggleTheme, printDoc: this.printDoc }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
