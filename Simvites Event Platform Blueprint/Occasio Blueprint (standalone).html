ackground:var(--paper-2)\">Eid<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Anniversary<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Graduation<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Retirement<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Private dinner<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Community gathering<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Charity gala<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Corporate launch<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Conference<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3);background:var(--paper-2)\">Workshop · Retreat<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-08\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">08 — Religious &amp; cultural sensitivity rules<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">Culturally aware. Never prescriptive.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 34px\">Twenty rules, split into the assumptions we refuse to make and the freedoms we guarantee. They are the cultural counterpart to the product principles — paste them into design reviews.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:32px\">\n    <div style=\"background:var(--bad-soft);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);margin-bottom:16px\">Never assume<\u002Fdiv>\n      <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;font-size:13.5px;line-height:1.5;color:var(--ink-2);counter-reset:n\">\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">01<\u002Fspan><span>The wedding is Hindu — most South Asian weddings aren't.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">02<\u002Fspan><span>There's a \"bride and groom\" — allow any partner labels.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">03<\u002Fspan><span>One family structure — sides, hosts and elders vary.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">04<\u002Fspan><span>All guests attend all events — they almost never do.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">05<\u002Fspan><span>It happens on one day — assume many, across venues.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">06<\u002Fspan><span>Ceremonies follow one fixed order — they don't.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">07<\u002Fspan><span>Religious symbols are decoration — never use them carelessly.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">08<\u002Fspan><span>Users want a religious category — never force one.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">09<\u002Fspan><span>Clichés read as culture — avoid stereotyped motifs.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bad);flex:none\">10<\u002Fspan><span>Louder means more authentic — elegance over decoration.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div style=\"background:var(--ok-soft);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-bottom:16px\">Always allow &amp; respect<\u002Fdiv>\n      <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;font-size:13.5px;line-height:1.5;color:var(--ink-2)\">\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">11<\u002Fspan><span>Custom-name every single event.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">12<\u002Fspan><span>Remove any section, page or field.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">13<\u002Fspan><span>Create entirely new, host-defined event types.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">14<\u002Fspan><span>Neutral, elegant copy by default.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">15<\u002Fspan><span>Cultural presets are optional and opt-in.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">16<\u002Fspan><span>Every religion &amp; culture treated equally well.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">17<\u002Fspan><span>Inclusive language for couples, hosts, families, guests.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">18<\u002Fspan><span>Full support for interfaith &amp; mixed-culture events.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">19<\u002Fspan><span>Full support for civil &amp; secular ceremonies.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:9px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ok);flex:none\">20<\u002Fspan><span>Host controls exactly what cultural explanation appears.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 28px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px\">Flexible labels — every word is the host's<\u002Fdiv>\n    <p style=\"font-size:14.5px;line-height:1.6;color:var(--ink-2);margin:0 0 18px;max-width:62ch\">The database speaks broad nouns; the UI shows whatever the host wants. This is also what makes the platform portable to birthdays and corporate later.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)\">guest<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"color:var(--ink)\">Guest · Attendee · Mehmaan<\u002Fspan><\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)\">host<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"color:var(--ink)\">Couple · Bride · Groom · Partner<\u002Fspan><\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)\">household<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"color:var(--ink)\">Family · Household · Group<\u002Fspan><\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)\">response<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"color:var(--ink)\">RSVP · Registration<\u002Fspan><\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)\">event<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"color:var(--ink)\">Ceremony · Reception · Party<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-09\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">09 — MVP definition<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">Lean enough to ship. Premium enough to sell.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 34px\">The MVP does one job completely: a couple builds a beautiful multi-event site, sends each household a personalised invite, and watches per-event RSVPs arrive — all on a platform subdomain, paid once. Everything not in service of that first cheque is cut, faked, or merely designed-for.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:30px\">\n    <div style=\"background:var(--ok-soft);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-bottom:14px\">In the MVP<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n        <span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Auth + account<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Create event site<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">One excellent template<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Puck block editor<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Theme + light/dark<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Event schedule<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Households + guests<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Per-event invitations<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Personalised links<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Email invites (Resend)<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">RSVP form + dashboard<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Draft / publish<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Subdomain hosting<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Stripe unlock<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">Mobile-first public site<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink);background:var(--surface)\">CSV export<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--paper-2);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px\">Explicitly NOT in the MVP<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n        <span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Custom domains<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">WhatsApp / SMS<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Seating charts<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Guest photo uploads<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">AI guest-list parsing<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Many templates<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Corporate mode<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Planner marketplace<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Mobile app<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Template marketplace<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Subscriptions<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Public ticketing<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-3)\">Event check-in<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:12.5px;line-height:1.55;color:var(--ink-3);margin:16px 0 0\">Each is <em>designed-for<\u002Fem> in the IA and schema so it slots in later without a rebuild — see §31.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(218px,1fr));gap:14px;margin-bottom:30px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;lett -3);flex:none;width:18px\">06<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink-2)\">Sends a test, then unlocks with Stripe &amp; publishes<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px;padding-bottom:13px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;width:18px\">07<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink-2)\">Sends invites; watches RSVPs land on the dashboard<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-ink);flex:none;width:18px\">08<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink)\">Reminds non-responders, publishes updates, exports final numbers<\u002Fspan><\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">Guest journey · the volume<\u002Fdiv>\n      <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0\">\n        <li style=\"display:flex;gap:12px;padding-bottom:13px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;width:18px\">01<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink-2)\">Receives a personalised link by email (or WhatsApp later)<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px;padding-bottom:13px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;width:18px\">02<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink-2)\">Opens to a warm welcome with their own name<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px;padding-bottom:13px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;width:18px\">03<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink-2)\">Sees <em>only<\u002Fem> the events they're invited to<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px;padding-bottom:13px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;width:18px\">04<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink-2)\">RSVPs per event, for each member of the household<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px;padding-bottom:13px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;width:18px\">05<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink-2)\">Adds dietary needs &amp; a message to the hosts<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px;padding-bottom:13px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;width:18px\">06<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink-2)\">Gets a confirmation; can revisit to edit before the deadline<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-ink);flex:none;width:18px\">07<\u002Fspan><span style=\"font-size:13.5px;color:var(--ink)\">Later sees updates — schedule changes, travel, the gallery<\u002Fspan><\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">Future flows — designed-for, not built yet<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n      <span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">Birthday setup<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">Corporate registration<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">Planner · multi-client<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">Custom domain setup<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">WhatsApp invites<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">Seating publish<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">Gallery moderation<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">Open / approval registration<\u002Fspan><span style=\"border:1px dashed var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-3)\">Interest survey first<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-14\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">14 — UX edge cases<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:20ch\">The cases that decide whether people trust you.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 28px\">Most are about one thing: a guest seeing exactly what they should, and a host never feeling they've broken something. Each has a defined handling.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"overflow-x:auto\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px\">\n    <thead><tr><th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 16px 10px 0;border-bottom:1px solid var(--line-2);width:42%\">Edge case<\u002Fth><th style=\"text-align:left;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 0 10px;border-bottom:1px solid var(--line-2)\">Handling<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody style=\"vertical-align:top\">\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Household split across events (Auntie at 3 of 5)<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Per-guest × per-event matrix; guest sees only their intersection<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Uninvited event<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Disappears entirely — never greyed-out or hinted at<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Household cap lower than named guests<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Server-enforced cap; guest sees \"X of Y can attend,\" host warned<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Plus-ones (allowed / not)<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Per-household flag; \"+1\" slot appears only when permitted<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Adults-only event with child in household<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Children hidden from that event's RSVP; gentle note<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Revoked / old token<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">\"This link is no longer active\" + contact-host route<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">RSVP after deadline<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Read-only summary; \"contact the hosts to change\"<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Double submit<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Idempotent; latest response wins, with an edit history<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Venue / time changes after RSVPs<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Publish update → optional notify affected guests only<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Guest has no email / phone only<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Copyable link to send any way; host-entered RSVP fallback<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Invite email bounces<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Flagged in delivery view; prompt to fix or copy link<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Duplicate / misspelled guest<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Import dedupe suggestions; inline merge &amp; rename<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Draft edits not yet published<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Public reads last snapshot; \"unpublished changes\" banner<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Elderly / low-confidence guest<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Large type &amp; targets, no jargon, host-entered RSVP option<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;border-bottom:1px solid var(--line);color:var(--ink)\">Info-only event (no RSVP)<\u002Ftd><td style=\"padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink-2)\">Shown for context; no response controls rendered<\u002Ftd><\u002Ftr>\n      <tr><td style=\"padding:11px 16px 11px 0;color:var(--ink)\">Reminder targeting<\u002Ftd><td style=\"padding:11px 0;color:var(--ink-2)\">Sends only to non-responders for the chosen events<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-15\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">15 — Visual design direction<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:20ch\">Editorial restraint meets SaaS precision.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 22px\">The look you're reading <em>is<\u002Fem> the system: a high-contrast serif for emotion, a clean grotesque for clarity, warm near-neutral surfaces, one confident accent, and a lot of air. It should feel like a fashion editorial that happens to be excellent software — calm, expensive, never loud.<\u002Fp>\n  <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:30px\">\n    <span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-2)\">Editorial<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-2)\">Calm<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-2)\">Warm-neutral<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-2)\">Considered<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-2)\">Mobile-first<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-2)\">Celebratory, quietly<\u002Fspan><span style=\"border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-2)\">Trustworthy<\u002Fspan>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:26px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:6px\">Layout &amp; grid<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Generous whitespace; a 12-col editorial grid that breaks to single-column on mobile; asymmetry over centred everything.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:6px\">Motion<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Subtle, ease-out, 200–700ms. Gentle rise-on-scroll. No bounce, no parallax theatrics, respects reduced-motion.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:6px\">Cards &amp; surfaces<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Hairline borders, 14–18px radius, near-flat shadows. Depth comes from spacing, not heavy elevation.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:6px\">Buttons &amp; forms<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">One solid accent action, ghost secondaries. Inputs are large, calm, 44px+ targets, obvious focus rings.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:6px\">Imagery &amp; icons<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Real photography, full-bleed where it earns it. Thin 1.5px line icons. Striped placeholders until photos exist.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px\"><div style=\"font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:6px\">Empty &amp; dark<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">Empty states are warm with a single CTA. Light &amp; dark are both first-class — designed together, not inverted.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n    <div style=\"background:var(--ok-soft);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);margin-bottom:12px\">Do<\u002Fdiv><ul style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink-2)\"><li>Let typography and space carry the design<\u002Fli><li>Use the accent sparingly, for one thing at a time<\u002Fli><li>Design the phone first, every time<\u002Fli><li>Make photography the hero where the host has it<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:var(--bad-soft);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-bottom:12px\">Avoid (AI slop)<\u002Fdiv><ul style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink-2)\"><li>Purple-blue gradient hero backgrounds<\u002Fli><li>Emoji as UI, decorative religious motifs<\u002Fli><li>Tacky script fonts &amp; gold-foil clichés<\u002Fli><li>Rounded cards with a left-accent border everywhere<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-16\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">16 — Design system<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp( =\"font-weight:650;color:var(--ink);font-size:13.5px\">Corporate Launch · Conference<\u002Fspan><div style=\"font-size:12.5px;color:var(--ink-2);line-height:1.45\">Agenda + speakers + registration, on-brand for the client.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px\"><span style=\"color:var(--ink-3);flex:none\">·<\u002Fspan><div><span style=\"font-weight:650;color:var(--ink);font-size:13.5px\">Workshop · Retreat<\u002Fspan><div style=\"font-size:12.5px;color:var(--ink-2);line-height:1.45\">Smaller, sessions + logistics, approval registration.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px\"><span style=\"color:var(--ink-3);flex:none\">·<\u002Fspan><div><span style=\"font-weight:650;color:var(--ink);font-size:13.5px\">Networking · Charity Gala<\u002Fspan><div style=\"font-size:12.5px;color:var(--ink-2);line-height:1.45\">Ticketing-ready, attendee types, check-in later.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"border-left:2px solid var(--accent);padding-left:22px\">\n    <p style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(19px,2.4vw,24px);line-height:1.32;color:var(--ink);margin:0;max-width:46ch\">Faith templates earn trust through restraint. The Sikh template isn't \"khanda everywhere\" — it's a beautiful site that happens to seed an Anand Karaj and use a palette the community will recognise as tasteful.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-22\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">22 — Dashboard<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink); -bottom:4px\">Next step<\u002Fdiv><div style=\"font-size:14.5px;color:var(--ink);font-weight:600\">Remind 54 guests who haven't replied to the Ceremony<\u002Fdiv><\u002Fdiv>\n          <span style=\"background:var(--surface);border:1px solid var(--accent-line);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;white-space:nowrap\">Send reminder<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px\">\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--ink);line-height:1\">214<\u002Fdiv><div style=\"font-size:11px;color:var(--ink-3);margin-top:3px\">Invited<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--ok);line-height:1\">142<\u002Fdiv><div style=\"font-size:11px;color:var(--ink-3);margin-top:3px\">Attending<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--bad);line-height:1\">18<\u002Fdiv><div style=\"font-size:11px;color:var(--ink-3);margin-top:3px\">Declined<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px\"><div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:var(--warn);line-height:1\">54<\u002Fdiv><div style=\"font-size:11px;color:var(--ink-3);margin-top:3px\">Awaiting<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:16px\">\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:12px;pad ;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">25 — Registration &amp; RSVP models<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">Build one model. Configure the rest.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 28px\">The brief lists dozens of registration types. They are not dozens of features — they're settings on one <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">response<\u002Fspan> model. MVP ships exactly one path; the rest are designed into the schema so they switch on without a rebuild. <span style=\"color:var(--accent-ink);font-weight:600\">●<\u002Fspan> MVP · <span style=\"color:var(--ink-3)\">○<\u002Fspan> later.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px\">RSVP models (weddings)<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink-2)\">\n      <div><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Per-household token link<\u002Fdiv>\n      <div><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Household responds for all<\u002Fdiv>\n      <div><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Per-event RSVP<\u002Fdiv>\n      <div><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Plus-one allowed / blocked<\u002Fdiv>\n      <div><span style=\"color:var(--accent-ink)\">●<\u002Fspan> Children included / excluded<\u002Fdiv>\n d code lookup<\u002Fdiv>\n      <div><span style=\"color:var(--ink-3)\">○<\u002Fspan> Magic link<\u002Fdiv>\n      <div><span style=\"color:var(--ink-3)\">○<\u002Fspan> OTP verification<\u002Fdiv>\n      <div><span style=\"color:var(--ink-3)\">○<\u002Fspan> Approval-based access<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:20px 24px\"><p style=\"margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)\"><strong style=\"color:var(--ink)\">The form builder follows the same rule.<\u002Fstrong> MVP ships a fixed, lovely set — attending per event, dietary needs, message to hosts, plus a couple of custom questions. The full field palette (multi-select, file upload, meal choice, accessibility, transport, session selection, ticket type) is designed into the schema and surfaced when a later phase needs it.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-26\" style=\"padding:64px 0;border-top:1px solid var(--line)\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px\">26 — Invite delivery<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0 0 22px;max-width:18ch\">Email first. Warm, premium, trustworthy.<\u002Fh2>\n  <p data-reveal=\"\" style=\"font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:66ch;margin:0 0 26px\">MVP sends via Resend, with delivery tracking and a copyable link for anyone without email. WhatsApp and SMS are designed-for as additional channels later, on the same batch model.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;align-items:center\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px\">Choose segment<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px\">Preview<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px\">Send test<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px\">Send batch<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px\">Track delivery<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-ink);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:8px;padding:6px 11px\">Remind non-responders<\u002Fspan>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px\">Message copy library<\u002Fdiv>\n  <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px\">Initial invite<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">\"Aanya &amp; Dev would be honoured by your company. Open your personal invitation to see your events and RSVP.\"<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px\">Reminder<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">\"A gentle nudge — we'd love your reply by 12 Aug so we can plan. It only takes a minute.\"<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px\">Schedule update<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">\"A small change: the Sangeet now starts at 7:30pm. Everything else is the same — see the updated schedule.\"<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px\">Deadline approaching<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">\"Last call! RSVPs close tomorrow. If you haven't let us know yet, now's the moment.\"<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px\">Seating live ○<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\">\"Find your table — seating for the reception is now live on your invitation.\"<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16 x;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px\">Review changes<\u002Fspan><span style=\"color:var(--ink-3)\">→<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-ink);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:8px;padding:6px 11px\">Publish<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55;color:var(--ink-2)\">\n        <div><strong style=\"color:var(--ink)\">Snapshot model.<\u002Fstrong> Publish writes an immutable version the public site serves — fast, cache-friendly, leak-proof.<\u002Fdiv>\n        <div><strong style=\"color:var(--ink)\">Unpublished-changes banner.<\u002Fstrong> The app always shows whether the live site is behind the draft.<\u002Fdiv>\n        <div><strong style=\"color:var(--ink)\">Version history &amp; rollback.<\u002Fstrong> ○ Later — keep snapshots; one-click restore to a previous live version.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px\">\n      <div style=\"font-family:'Instrument Serif',serif;font-size:20px;color:var(--ink);margin-bottom:4px\">Publish changes<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:var(--ink-3);margin-bottom:14px\">3 changes since last publish<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2);margin-bottom:16px\">\n        <div style=\"display:flex;gap:8px\"><span style=\"color:var(--accent-ink)\">·<\u002Fspan> Sangeet start time → 7:30pm<\u002Fdiv>\n        <div style=\"display:flex;gap:8px\"><span style=\"color:var(--accent-ink)\">·<\u002Fspan> Added \"Travel\" page<\u002Fdiv>\n        <div style=\"display:flex;gap:8px\"><span style=\"color:var(--accent-ink)\">·<\u002Fspan> Updated FAQ<\u002Fdiv>\n      <\u002Fdiv>\n
